# sine_64: a continuous 1000 Hz tone in the centre of a 64^3 box.
# The walls reflect, so the tone builds up a standing-wave pattern.
nx = 64
ny = 64
nz = 64
dx = 0.01
c = 343
cfl = 0.5
steps = 1000
snapshot_every = 50
snapshot_axis = z
snapshot_index = -1
output_dir = out/sine_64
source = 32 32 32 sine 1000 0.05
