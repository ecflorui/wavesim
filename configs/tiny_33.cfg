# tiny_33: smallest reference case, runs in milliseconds.
# Reference: max |p| after the last step = 0.04977
nx = 33
ny = 33
nz = 33
dx = 0.01             # meters between grid points
c = 343               # wave speed, m/s
cfl = 0.5             # c*dt/dx, must be <= 0.577
steps = 200
snapshot_every = 40   # 0 = no slices
snapshot_axis = z     # x | y | z
snapshot_index = -1   # -1 = middle
output_dir = out/tiny_33
# source = i j k type freq_hz amplitude      (type: ricker | sine)
source = 16 16 16 ricker 2000 1.0
